    }

      height: 6px;
    }

    }

      transition: all 0.2s ease;
    }
    
    .sidebar-item:hover {
      background: rgba(59, 130, 246, 0.1);
    }
    
    .sidebar-item.active {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.15) 0%, transparent 100%);
      border-left: 3px solid #3b82f6;
    }
    
    .card-stat {
      transition: all 0.3s ease;
    }
    
    .card-stat:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transition: all 0.2s ease;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
    }
    
    .toast {
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    
    .modal-overlay {
      animation: fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .step-indicator {
      transition: all 0.3s ease;
    }
    
    .step-indicator.active {
      background: #2563eb;
      color: white;
    }
    
    .step-indicator.completed {
      background: #10b981;
      color: white;
    }
    
    .input-field:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    
    .table-row:hover {

    }
    
    .badge {

      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }

    // ==================== HELPER FUNCTIONS ====================
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const date = new Date(dateStr);
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getStatusBadge(status) {
      const badges = {
        berjalan: 'bg-blue-100 text-blue-700',
        selesai: 'bg-green-100 text-green-700',
        akan_datang: 'bg-amber-100 text-amber-700',
        dibatalkan: 'bg-red-100 text-red-700',
        aktif: 'bg-green-100 text-green-700',
        pending: 'bg-amber-100 text-amber-700',
        terbit: 'bg-green-100 text-green-700',
        draft: 'bg-slate-100 text-slate-700'
      };
      return badges[status] || 'bg-slate-100 text-slate-700';
    }

    function getStatusLabel(status) {
      const labels = {
        berjalan: 'Berjalan',
        selesai: 'Selesai',
        akan_datang: 'Akan Datang',
        dibatalkan: 'Dibatalkan',
        aktif: 'Aktif',
        pending: 'Pending',
        terbit: 'Terbit',
        draft: 'Draft'
      };
      return labels[status] || status;
    }

    function getMetodeLabel(metode) {
      const labels = {
        daring: 'Daring',
        luring: 'Luring',
        hybrid: 'Hybrid'
      };
      return labels[metode] || metode;
    }

    function showToast(message, type = 'success') {
      const toastContainer = document.getElementById('toast-container');
      if (!toastContainer) return;
      
      const toast = document.createElement('div');
      toast.className = `toast flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg ${
        type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'
      } text-white`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span>
        <span>${message}</span>
      `;
      toastContainer.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    }

    // ==================== MODALS ====================
    function renderModal(type, id = null) {
      let title = '';
      let content = '';

      switch(type) {
        case 'kegiatan':
          title = id ? 'Edit Kegiatan' : 'Tambah Kegiatan';
          content = renderKegiatanForm(id);
          break;
        case 'peserta':
          title = id ? 'Edit Peserta' : 'Tambah Peserta';
          content = renderPesertaForm(id);
          break;
        case 'generate-sertifikat':
          title = 'Generate Sertifikat';
          content = renderGenerateSertifikatForm(id);
          break;
        case 'surat-tugas':
          title = 'Buat Surat Tugas';
          content = renderSuratTugasForm();
          break;
        case 'delete-confirm':
          title = 'Konfirmasi Hapus';
          content = renderDeleteConfirm();
          break;
        default:
          return '';
      }

      return `
        <div class="fixed inset-0 z-50 overflow-y-auto modal-overlay">
          <div class="min-h-screen px-4 flex items-center justify-center">
            <div class="fixed inset-0 bg-black/50" onclick="closeModal()"></div>
            <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
              <div class="flex items-center justify-between p-5 border-b border-slate-100">
                <h2 class="text-lg font-semibold text-slate-800">${title}</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500">
                  ${icons.close}
                </button>
              </div>
              <div class="p-5 overflow-y-auto" style="max-height: calc(90vh - 140px);">
                ${content}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handleTemplateUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Validasi format
      const validTypes = ['application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
      if (!validTypes.includes(file.type) && !file.name.endsWith('.docx')) {
        showToast('Format file harus DOCX!', 'error');
        return;
      }

      // Validasi ukuran (5 MB)
      const maxSize = 5 * 1024 * 1024;
      if (file.size > maxSize) {
        showToast('Ukuran file tidak boleh lebih dari 5 MB!', 'error');
        return;
      }

      // Tampilkan info file
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('file-info').classList.remove('hidden');
      showToast('File berhasil diupload!');
    }
